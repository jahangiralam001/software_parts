<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeBuilder{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=3">
</head>
<body>
    {% block header %}
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand">ResumeBuilder</h1>
            <nav>
                <a href="/resumes" class="nav-link">My Resumes</a>
                <a href="/" class="nav-link btn-new">+ New Resume</a>
            </nav>
        </div>
    </header>
    {% endblock %}

    <main class="{% block main_class %}container main-content{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
