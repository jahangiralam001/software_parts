<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="chat-container">

            <!-- Header -->
            <div class="chat-header">
                <div class="header-avatar">
                    <div class="avatar">U</div>
                    <span class="status-dot"></span>
                </div>
                <div class="header-info">
                    <h1 class="chat-title">Chat Room - V1</h1>
                    <span class="chat-status">Active now</span>
                </div>
                <div class="header-actions">
                    <!-- End-to-end encryption key setup -->
                    <button id="e2eeBtn" class="call-btn e2ee-btn" title="Set encryption key" aria-label="Set encryption key">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
                            <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v2.25H6a2.25 2.25 0 00-2.25 2.25v8.25A2.25 2.25 0 006 21.75h12a2.25 2.25 0 002.25-2.25V11.25A2.25 2.25 0 0018 9h-.75V6.75A5.25 5.25 0 0012 1.5zm3.75 7.5V6.75a3.75 3.75 0 10-7.5 0v2.25h7.5z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <!-- Audio call -->
                    <button id="callBtn" class="call-btn" title="Audio Call">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
                            <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <!-- Video call -->
                    <button id="videoCallBtn" class="call-btn" title="Video Call">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M4.5 4.5a3 3 0 00-3 3v9a3 3 0 003 3h8.25a3 3 0 003-3v-9a3 3 0 00-3-3H4.5zM19.94 18.75l-2.69-2.69V7.94l2.69-2.69c.944-.945 2.56-.276 2.56 1.06v11.38c0 1.336-1.616 2.005-2.56 1.06z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Active Audio Call Bar -->
            <div id="activeCallBar" class="active-call-bar hidden">
                <div class="call-bar-info">
                    <span class="call-live-dot"></span>
                    <span id="callDuration" class="call-duration">Calling...</span>
                </div>
                <div class="call-bar-controls">
                    <button id="muteBtn" class="call-control-btn mute-btn" title="Mute">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="13" height="13">
                            <path d="M8.25 4.5a3.75 3.75 0 117.5 0v8.25a3.75 3.75 0 11-7.5 0V4.5z"/>
                            <path d="M6 10.5a.75.75 0 01.75.75v1.5a4.5 4.5 0 009 0v-1.5a.75.75 0 011.5 0v1.5a6 6 0 01-5.25 5.954V21h2.25a.75.75 0 010 1.5h-6a.75.75 0 010-1.5H10.5v-2.796A6 6 0 014.5 12.75v-1.5A.75.75 0 016 10.5z"/>
                        </svg>
                    </button>
                    <button id="endCallBtn" class="call-control-btn end-call-btn" title="End Call">
                        <svg style="transform:rotate(135deg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
                            <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Outgoing Call Screen (shown while callState === 'calling') -->
            <div id="callingOverlay" class="calling-overlay hidden">
                <div class="calling-body">
                    <div class="calling-avatar-wrap">
                        <span class="calling-ring calling-ring-1"></span>
                        <span class="calling-ring calling-ring-2"></span>
                        <div class="calling-avatar">U</div>
                    </div>
                    <div class="calling-name">Other User</div>
                    <div class="calling-status">
                        Calling
                        <span class="calling-dot d1">.</span><span class="calling-dot d2">.</span><span class="calling-dot d3">.</span>
                    </div>
                </div>
                <div class="calling-controls">
                    <button id="cancelCallBtn" class="calling-cancel-btn" title="Cancel">
                        <svg style="transform:rotate(135deg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="26" height="26">
                            <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Incoming Call Overlay -->

            <div id="incomingCallOverlay" class="incoming-call-overlay hidden">
                <div class="incoming-call-card">
                    <div class="incoming-call-avatar-wrap">
                        <span class="pulse-ring"></span>
                        <div class="incoming-call-avatar">U</div>
                    </div>
                    <span id="incomingTypeLabel" class="incoming-call-label">📞 Audio Call</span>
                    <span class="incoming-call-name">Other User</span>
                    <div class="incoming-call-actions">
                        <button id="rejectCallBtn" class="call-action-btn reject-btn" title="Reject">
                            <svg style="transform:rotate(135deg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                                <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                        <button id="acceptCallBtn" class="call-action-btn accept-btn" title="Accept">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
                                <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Video Call Overlay -->
            <div id="videoCallOverlay" class="video-call-overlay hidden">
                <!-- WebRTC remote video (used when P2P works) -->
                <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
                <!-- Relay fallback: JPEG frames sent through our Socket.IO server -->
                <img id="relayVideoImg" class="remote-video relay-video-img hidden" alt="">
                <video id="localVideo"  class="local-video"  autoplay playsinline muted></video>
                <div class="vc-duration-badge">
                    <span class="call-live-dot"></span>
                    <span id="videoCallDuration">Calling...</span>
                </div>
                <div id="callModeBadge" class="call-mode-badge">Connecting...</div>
                <!-- Relay mode badge — shown when P2P fails and server is relaying -->
                <div id="relayBadge" class="relay-badge hidden">📡 via server</div>
                <div class="vc-controls">
                    <!-- Mute audio -->
                    <button id="videoMuteAudioBtn" class="vc-btn" title="Mute Audio">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M8.25 4.5a3.75 3.75 0 117.5 0v8.25a3.75 3.75 0 11-7.5 0V4.5z"/>
                            <path d="M6 10.5a.75.75 0 01.75.75v1.5a4.5 4.5 0 009 0v-1.5a.75.75 0 011.5 0v1.5a6 6 0 01-5.25 5.954V21h2.25a.75.75 0 010 1.5h-6a.75.75 0 010-1.5H10.5v-2.796A6 6 0 014.5 12.75v-1.5A.75.75 0 016 10.5z"/>
                        </svg>
                    </button>
                    <!-- End call -->
                    <button id="videoEndCallBtn" class="vc-btn vc-end-btn" title="End Call">
                        <svg style="transform:rotate(135deg)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                            <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 013-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 01-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 006.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 011.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 01-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <!-- Mute video -->
                    <button id="videoMuteVideoBtn" class="vc-btn" title="Camera Off">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M4.5 4.5a3 3 0 00-3 3v9a3 3 0 003 3h8.25a3 3 0 003-3v-9a3 3 0 00-3-3H4.5zM19.94 18.75l-2.69-2.69V7.94l2.69-2.69c.944-.945 2.56-.276 2.56 1.06v11.38c0 1.336-1.616 2.005-2.56 1.06z"/>
                        </svg>
                    </button>
                </div>
            </div>


            <!-- Messages area -->
            <div id="message" class="messages-area"></div>

            <!-- Bottom bar -->
            <div class="bottom-bar">
                <div id="typing" class="typing-indicator"></div>
                <div class="input-row">
                    <input type="file" id="imageInput" class="image-input" accept="image/*" hidden>
                    <button id="imageBtn" class="media-btn" title="Upload image">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path fill-rule="evenodd" d="M1.5 6a3 3 0 013-3h15a3 3 0 013 3v12a3 3 0 01-3 3h-15a3 3 0 01-3-3V6zm15.75 2.25a.75.75 0 00-.75.75v4.19l-1.72-1.72a.75.75 0 00-1.06 0l-3.97 3.97-1.72-1.72a.75.75 0 00-1.06 0l-2.25 2.25a.75.75 0 101.06 1.06l1.72-1.72 1.72 1.72a.75.75 0 001.06 0l3.97-3.97 1.72 1.72a.75.75 0 001.28-.53V9a.75.75 0 00-.75-.75zM8.25 9a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                    <input type="text" id="messageInput" class="message-input" placeholder="Aa" autocomplete="off"/>
                    <button id="sendBtn" class="send-btn" title="Send">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z"/>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <div id="appDialog" class="app-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
        <div class="app-dialog-backdrop" data-dialog-close="backdrop"></div>
        <div class="app-dialog-panel">
            <h2 id="appDialogTitle" class="app-dialog-title">Notice</h2>
            <p id="appDialogMessage" class="app-dialog-message"></p>
            <input id="appDialogInput" class="app-dialog-input hidden" type="text" />
            <div class="app-dialog-actions">
                <button id="appDialogCancel" class="app-dialog-btn app-dialog-cancel">Cancel</button>
                <button id="appDialogOk" class="app-dialog-btn app-dialog-ok">OK</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
